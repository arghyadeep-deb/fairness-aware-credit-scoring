services:
  - type: web
    name: fairness-credit-scoring
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
