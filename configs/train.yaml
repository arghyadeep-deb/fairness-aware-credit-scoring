# Shared trainer settings (specs/09). Arm files (arm_*.yaml) only choose model/loss/sampling.
base_config: configs/data.yaml
training:
  batch_size: 2048
  max_epochs: 30
  patience: 4              # early stopping on val AUC-PR
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  bf16: true
  seeds: [0, 1, 2]
  prob_clip: 1.0e-6
model_defaults:
  tabtransformer: {emb_dim: 32, heads: 4, layers: 3, attn_dropout: 0.1, ffn_mult: 2, mlp: [128, 64], dropout: 0.1}
  cnn1d: {emb_dim: 8, channels: [32, 64], kernel: 3, mlp: [64], dropout: 0.1}
  mlp: {emb_dim: 8, hidden: [256, 128, 64], dropout: 0.1}
optuna:
  trials: 10
  epochs: 8
  subsample: 0.3
  sampler_seed: 42
  n_startup_trials: 4      # random trials before TPE takes over
  train_seed: 0
  space:
    lr: {low: 3.0e-4, high: 3.0e-3, log: true}
    weight_decay: {low: 1.0e-6, high: 1.0e-3, log: true}
    dropout: {low: 0.0, high: 0.3}
    emb_dim: [16, 32, 64]          # transformer arms only
    focal_gamma: {low: 1.0, high: 3.0}   # A5 only
smote:
  sampling_ratio: 0.5
  k_neighbors: 5
group_calibration:      # G1 only
  lambda_c: 1.0
  bins: 10
  sigma: 0.05
evaluation:
  flag_rate: 0.10
  ece_bins: 15
  bootstrap: {n: 1000, seed: 0}
reference:              # REF: LightGBM reference ceiling (not an arm), full train, early stopping on val AUC
  lightgbm:
    n_estimators: 5000
    learning_rate: 0.02
    num_leaves: 31
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.5
    reg_lambda: 5.0
    metric: auc
    early_stopping_rounds: 200
exponentiated_gradient:  # S2-EG
  eps: 0.01
  max_iter: 50
  logistic_max_iter: 300
runs_dir: artifacts/runs
mlflow_experiment: phase2_baselines
joint:                  # Phase 3: joint objective (specs/09). Lambdas are set per run / sweep point.
  warmup_epochs: 3
  ramp_epochs: 5
  adversary_hidden: 32
  fairness: {type: eo, temperature: 0.1}   # temperature applies to the batch-standardised logit gap
  calibration: {bins: 10, sigma: 0.05}
  normalize: initial       # Phase 4: divide each term by its warm-up magnitude (logged per run)
  sampler: {min_per_cell: 64}   # stratified batches: >= 64 per TARGET x gender cell
  auc_floor: 0.60          # sweep points below this val AUC-ROC are discarded from the frontier
  smoke: {warmup_epochs: 1, ramp_epochs: 1, epochs: 3}   # compressed schedule for the 3-epoch smoke run only
  hp_source: artifacts/runs/20261101T055729Z_phase2/a2/tuning.json   # A2 hyper-parameters, no re-tuning
sweep:
  grid: {lambda_f: [0.0, 0.5, 2.0], lambda_c: [0.0, 0.5, 2.0], lambda_a: [0.0, 0.5, 1.0]}
  seeds: [0, 1, 2]
