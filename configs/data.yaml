# Home Credit data spec (specs/08).
base_config: configs/base.yaml
id_column: SK_ID_CURR
target_column: TARGET
gender_column: CODE_GENDER
gender_drop_values: [XNA]
gender_encoding: {F: 0, M: 1}
split:
  seed: 42
  fractions: {train: 0.70, val: 0.15, test: 0.15}
numeric_raw: [CNT_CHILDREN, CNT_FAM_MEMBERS, AMT_INCOME_TOTAL, AMT_CREDIT, AMT_ANNUITY,
  AMT_GOODS_PRICE, REGION_POPULATION_RELATIVE]
days_birth: DAYS_BIRTH
days_employed: DAYS_EMPLOYED
days_employed_placeholder: 365243
days_per_year: 365.25
include_ext_source: true
ext_source_columns: [EXT_SOURCE_1, EXT_SOURCE_2, EXT_SOURCE_3]
add_ratios: true
categorical: [NAME_FAMILY_STATUS, NAME_EDUCATION_TYPE, NAME_INCOME_TYPE, NAME_HOUSING_TYPE,
  OCCUPATION_TYPE, ORGANIZATION_TYPE]
binary_yn: [FLAG_OWN_CAR, FLAG_OWN_REALTY]
# Outlier handling, scaler stage only (specs/05). Quantiles are fit on TRAIN. null keeps raw values.
clip_quantiles: [0.001, 0.999]
checks:
  max_split_gap_pp: 0.5      # default rate and female share may differ across splits by at most this
  min_cell_rows: 50          # every TARGET x GENDER cell per split
  mean_abs_tol: 0.05
  std_tol: 0.05
smoke:
  fraction: 0.05
leakage:
  seed: 42
  lightgbm:
    n_estimators: 2000
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    early_stopping_rounds: 50
  logistic: {max_iter: 300, C: 1.0}
  top_k: 15
  premise_auc_floor: 0.60
  shuffle_tolerance: 0.02
