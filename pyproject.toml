[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_nb*.py" = ["E501"]
"scripts/phase4b_*.py" = ["E501"]
"scripts/phase5_compare.py" = ["E501"]
"scripts/phase6*.py" = ["E501", "E401", "E402", "I001", "F841", "F401"]
"src/posthoc/phase5.py" = ["E501"]
"src/eval/final.py" = ["E501"]
"src/data/taiwan.py" = ["E501"]
"api/*.py" = ["E501"]
"tests/*.py" = ["E501"]
"scripts/freeze_bundle.py" = ["E501", "E402"]
"scripts/make_all_figures_tables.py" = ["E501", "E402"]
"scripts/ui_screenshots.py" = ["E501"]
"scripts/phaseE_diagnostics.py" = ["E501", "E402", "I001"]
"scripts/phaseE_three_way.py" = ["E501", "E402", "I001"]
"scripts/nb04_cell_paired.py" = ["F821", "I001"]
